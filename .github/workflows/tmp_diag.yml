name: tmp diag sys.platform

on:
  workflow_dispatch:
  push:
    branches: ['kanban/windows-collection-fix']

permissions:
  contents: read

jobs:
  diag:
    name: "Diagnose the sys.platform false positive"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Show what the probe sees for a sys.platform-guarded module
        run: |
          mkdir -p /tmp/splat
          cat > /tmp/splat/test_ok.py <<'PY'
          import os
          import sys

          import pytest


          @pytest.mark.skipif(sys.platform == "win32" or os.geteuid() == 0, reason="POSIX mode bits")
          def test_x():
              pass
          PY
          uv run --no-sync python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "g", "scripts/ci/check_test_posix_imports.py"
          )
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          recs = m.simulate_windows_imports([Path("/tmp/splat/test_ok.py")])
          for r in recs:
              print("VERDICT:", r)
          print("host sys.platform =", __import__("sys").platform)
          print("host os.name =", os.name)
          PY

      - name: Run the guard's own regression test for this shape
        run: uv run --no-sync python -m pytest tests/ci/test_check_test_posix_imports.py -q -k "sys_platform_guarded" -rA
